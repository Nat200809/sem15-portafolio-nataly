<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de temperatura | Nataly Rivera</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="caja">
    <h1>Conversor de temperatura</h1>
    <label for="valor">Temperatura</label>
    <input type="number" id="valor" placeholder="Ej: 25" value="25">
    <label for="tipo">Convertir</label>
    <select id="tipo">
      <option value="cf">De °C a °F</option>
      <option value="fc">De °F a °C</option>
    </select>
    <button id="convertir" style="width:100%">Convertir</button>
    <p class="resultado" id="resultado"></p>
    <a class="volver" href="../../Proyectos.html">← Volver al portafolio</a>
  </div>
  <script src="script.js"></script>
</body>
</html>
