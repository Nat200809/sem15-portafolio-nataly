<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adivina el número | Nataly Rivera</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="caja">
    <h1>Adivina el número</h1>
    <p style="text-align:center;margin-top:0">Pensé un número del 1 al 100.</p>
    <input type="number" id="intento" min="1" max="100" placeholder="Tu número">
    <button id="probar" style="width:100%">Probar</button>
    <p class="resultado" id="mensaje"></p>
    <p style="text-align:center;margin:0">Intentos: <b id="intentos">0</b></p>
    <button id="nuevo" style="width:100%;margin-top:12px;background:var(--vino-300);color:var(--vino-950)">Nuevo juego</button>
    <a class="volver" href="../../Proyectos.html">← Volver al portafolio</a>
  </div>
  <script src="script.js"></script>
</body>
</html>
