<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de colores | Nataly Rivera</title>
  <link rel="stylesheet" href="estilo.css">
  <style>
    #muestra { height:160px; border-radius:12px; margin-bottom:14px; border:1px solid var(--vino-100); transition:background .3s; }
    #codigo { text-align:center; font-size:1.6rem; font-weight:700; font-family:ui-monospace,Consolas,monospace; cursor:pointer; }
    .botones { display:flex; gap:10px; }
    .botones button { flex:1; }
    #vino { background:var(--vino-300); color:var(--vino-950); }
  </style>
</head>
<body>
  <div class="caja">
    <h1>Generador de colores</h1>
    <div id="muestra"></div>
    <p class="resultado" id="codigo" title="Toca para copiar"></p>
    <p class="resultado" id="aviso" style="font-size:.9rem;font-weight:400"></p>
    <div class="botones">
      <button id="azar">Color al azar</button>
      <button id="vino">Tono vino</button>
    </div>
    <a class="volver" href="../../Proyectos.html">← Volver al portafolio</a>
  </div>
  <script src="script.js"></script>
</body>
</html>
