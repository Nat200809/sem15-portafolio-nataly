<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IMC | Nataly Rivera</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="caja">
    <h1>Calculadora de IMC</h1>
    <label for="peso">Peso (kg)</label>
    <input type="number" id="peso" placeholder="Ej: 60" min="1" step="0.1">
    <label for="altura">Estatura (cm)</label>
    <input type="number" id="altura" placeholder="Ej: 165" min="30" max="260">
    <button id="calcular" style="width:100%">Calcular</button>
    <p class="resultado" id="imc"></p>
    <p class="resultado" id="categoria" style="font-size:1rem;font-weight:400"></p>
    <a class="volver" href="../../Proyectos.html">← Volver al portafolio</a>
  </div>
  <script src="script.js"></script>
</body>
</html>
